[package]
name = "pomodoro-cli"
version = "1.3.0"
authors = ["Jussi Kallio <jkallio@gmail.com>"]
license = "MIT"
description = "A simple command line Pomodoro timer."
readme = "README.md"
homepage = "https://github.com/jkallio/pomodoro-cli"
repository = "https://github.com/jkallio/pomodoro-cli"
keywords = ["pomodoro", "timer"]
categories = ["command-line-utilities"]
edition = "2024"

[[bin]]
name = "pomodoro-cli"

[dependencies]
chrono = "0.4"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
clap = { version = "4", features = ["derive", "cargo"] }
rodio = "0.22"
crossterm = "0.29"
lock = "0.1.0"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
serial_test = "3.0"

[profile.release]
strip = true        # Automatically strip symbols from the binary.
opt-level = "z"     # Optimize for binary size.
lto = true          # Enable Link Time Optimization.
panic = "abort"     # Abort on panic. (Removes backtrace info.)
